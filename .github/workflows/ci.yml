name: AKS Matrix CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-windows:
    name: Windows x64 (MSVC Native)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build pure native runtime and tools
        shell: cmd
        run: build.bat

      - name: Run full test suite
        shell: cmd
        run: test.bat

      - name: Verify CLI Version & Scaffolding
        shell: cmd
        run: |
          aks.exe --version
          aks.exe new my_aks_app
          aks.exe run my_aks_app\src\main.aks
          aks.exe test my_aks_app\tests\main_test.aks

      - name: Verify Standalone WebAssembly Binary (.wasm)
        shell: cmd
        run: |
          aks.exe wasm tests\TestWasmInput.aks -o test_module.wasm
          node -e "const fs=require('fs'); WebAssembly.instantiate(fs.readFileSync('test_module.wasm')).then(m => { console.log('WASM add(20, 22) =', m.instance.exports.add(20n, 22n)); if (m.instance.exports.add(20n, 22n) !== 42n) process.exit(1); });"

      - name: Verify Systems Features & Standalone Executable Build
        shell: cmd
        run: |
          aks.exe run tests\TestNewSystemsFeatures.aks
          aks.exe build tests\TestNewSystemsFeatures.aks -o standalone_test.exe
          standalone_test.exe

  build-and-test-linux:
    name: Linux Ubuntu x64 (GCC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang make cmake liburing-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build runtime and developer tools
        run: bash build.sh

      - name: Run POSIX test suite
        run: bash test.sh

      - name: Verify Standalone WebAssembly Binary (.wasm)
        run: |
          ./aks wasm tests/TestWasmInput.aks -o test_module.wasm
          node -e "const fs=require('fs'); WebAssembly.instantiate(fs.readFileSync('test_module.wasm')).then(m => { console.log('WASM add(20, 22) =', m.instance.exports.add(20n, 22n)); if (m.instance.exports.add(20n, 22n) !== 42n) process.exit(1); });"

      - name: Verify CLI Version & Scaffolding
        run: |
          ./aks --version
          ./aks new my_aks_app
          ./aks run my_aks_app/src/main.aks
          ./aks test my_aks_app/tests/main_test.aks

  build-and-test-macos:
    name: macOS ARM64 (Apple Clang)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build runtime and developer tools
        run: CC=clang bash build.sh

      - name: Run POSIX smoke and protocol tests
        run: |
          ./aks --version
          ./aks test tests/TestGenerics.aks
          ./aks test tests/TestDynTraits.aks
          ./aks run tests/TestCrypto.aks
          ./tests/TestProtocols

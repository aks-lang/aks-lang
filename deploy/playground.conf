# Nginx reverse proxy configuration for play.aks-lang.org
# Handles TLS termination, CORS preflight, rate limiting, and request buffering

limit_req_zone $binary_remote_addr zone=playground_limit:10m rate=10r/s;

server {
    listen 80;
    server_name play.aks-lang.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name play.aks-lang.org;

    ssl_certificate /etc/letsencrypt/live/play.aks-lang.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.aks-lang.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 1M;
    client_body_timeout 10s;

    location / {
        limit_req zone=playground_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS Headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}

